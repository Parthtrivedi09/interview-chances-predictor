<!DOCTYPE html>
<html>
<head>
    <title>Interview Predictor</title>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 40px;
        }

        h1 {
            margin-bottom: 20px;
        }

        form {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
        }

        input {
            margin: 8px;
            padding: 10px;
            width: 220px;
            border-radius: 5px;
            border: none;
        }

        button {
            padding: 10px 20px;
            background: #22c55e;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #16a34a;
        }

        #result {
            margin-top: 25px;
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            width: 60%;
            text-align: left;
        }

        ul {
            margin-top: 5px;
        }
    </style>
</head>

<body>

<h1>🎯 Interview Chance Predictor</h1>

<form id="form">
    <input type="file" name="file" required><br>

    <input type="number" step="0.01" name="cgpa" placeholder="CGPA" required><br>
    <input type="number" name="internships" placeholder="Internships" required><br>
    <input type="number" name="projects" placeholder="Projects" required><br>
    <input type="number" name="aptitude" placeholder="Aptitude Score" required><br>
    <input type="number" name="extracurricular" placeholder="Extracurricular (0/1)" required><br>
    <input type="number" name="workshops" placeholder="Workshops" required><br>
    <input type="number" name="placement_training" placeholder="Placement Training (0/1)" required><br>

    <br>
    <button type="submit">Predict</button>
</form>

<div id="result"></div>

<script>
document.getElementById("form").addEventListener("submit", async function(e) {
    e.preventDefault();

    const resultDiv = document.getElementById("result");
    resultDiv.innerHTML = "⏳ Processing...";

    const formData = new FormData(this);

    try {
        const response = await fetch("http://127.0.0.1:8000/predict", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        if (data.error) {
            resultDiv.innerHTML = "❌ " + data.error;
            return;
        }

        resultDiv.innerHTML = `
            <h2>📊 Result</h2>
            <p><b>Probability:</b> ${data.probability}%</p>
            <p><b>Voice Score:</b> ${data.voice_score}</p>

            <p><b>Strengths:</b></p>
            <ul>
                ${data.strengths.map(s => `<li>${s}</li>`).join("")}
            </ul>

            <p><b>Weaknesses:</b></p>
            <ul>
                ${data.weaknesses.map(w => `<li>${w}</li>`).join("")}
            </ul>
        `;

    } catch (error) {
        console.error(error);
        resultDiv.innerHTML = "❌ Error connecting to backend";
    }
});
</script>

</body>
</html>
