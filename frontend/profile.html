<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Candidate Profile</title>

<link rel="stylesheet" href="css/style.css">

<style>

.profile-card{

    width:500px;
    margin:40px auto;
    background:#1e293b;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.4);

}

.profile-card h2{

    margin-bottom:25px;

}

.profile-card input{

    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    font-size:16px;

}

.profile-card button{

    width:100%;
    margin-top:20px;
    padding:14px;
    background:#22c55e;
    color:white;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;

}

.profile-card button:hover{

    background:#16a34a;

}

#result{

    width:70%;
    margin:40px auto;
    background:#1e293b;
    padding:25px;
    border-radius:15px;
    display:none;

}

.progress{

    width:100%;
    background:#334155;
    border-radius:20px;
    overflow:hidden;
    margin:15px 0;

}

.progress-fill{

    height:22px;
    background:#22c55e;
    width:0%;
    color:black;
    font-weight:bold;
    text-align:center;

}

.tag{

    display:inline-block;
    padding:8px 12px;
    border-radius:8px;
    margin:5px;
    color:white;

}

.strength{

    background:#16a34a;

}

.weakness{

    background:#dc2626;

}

.suggestion{

    background:#2563eb;

}

.loader{

    border:4px solid #334155;
    border-top:4px solid #22c55e;
    border-radius:50%;
    width:35px;
    height:35px;
    animation:spin 1s linear infinite;
    margin:auto;

}

@keyframes spin{

0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}

}

</style>

</head>

<body>

<nav class="navbar">

<div class="logo">

🎯 Interview Success Predictor

</div>

</nav>

<div class="profile-card">

<h2>Candidate Profile</h2>

<p>

<b>Your Aptitude Score :</b>

<span id="aptitudeScore"></span>/100

</p>

<br>

<form id="profileForm">

<input type="file"
name="file"
required>

<input type="number"
step="0.01"
name="cgpa"
placeholder="CGPA"
required>

<input type="number"
name="internships"
placeholder="Internships"
required>

<input type="number"
name="projects"
placeholder="Projects"
required>

<input type="number"
name="extracurricular"
placeholder="Extracurricular (0/1)"
required>

<input type="number"
name="workshops"
placeholder="Workshops"
required>

<input type="number"
name="placement_training"
placeholder="Placement Training (0/1)"
required>

<button type="submit">

Predict Interview Success

</button>

</form>

</div>

<div id="result"></div>

<script src="js/profile.js"></script>

</body>

</html>
